name: AI Learning V8
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: ajk-learning-v8
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_learning_v8
      - run: python learning_foundation.py
      - name: Commit archive
        run: |
          if [ ! -d data/learning_v8 ]; then exit 0; fi
          git add data/learning_v8
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update V8 forecast and outcome archive'
          git pull --rebase origin main
          git push origin HEAD:main
