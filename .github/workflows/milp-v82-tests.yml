name: MILP V8.2 Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'milp_v82.py'
      - 'test_milp_v82.py'
      - 'install_v82.py'
      - 'app.py'
      - 'fpl_engine.py'
      - 'requirements.txt'
      - '.github/workflows/milp-v82-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AJK_REQUIRE_HIGHS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-v82.txt
      - run: python -m py_compile app.py fpl_engine.py milp_v82.py install_v82.py
      - run: python -m unittest test_milp_v82 test_engine
