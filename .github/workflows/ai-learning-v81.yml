name: AI Learning V8.1
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
permissions:
  contents: write
concurrency:
  group: ajk-learning-v8
  cancel-in-progress: false
jobs:
  train-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-v81.txt
      - run: python -m unittest test_ml_v81
      - run: python learning_foundation.py
      - run: python ml_v81.py auto
      - name: Commit V8.1 and V8 archives
        run: |
          for d in data/learning_v8 data/learning_v81; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update V8.1 ML model and shadow forecasts'
          git pull --rebase origin main
          git push origin HEAD:main
