name: Fast Greedy V8.2.1 Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'fpl_engine.py'
      - 'milp_v82.py'
      - 'fast_greedy_v821.py'
      - 'install_v821.py'
      - 'test_fast_greedy_v821.py'
      - 'requirements*.txt'
      - '.github/workflows/fast-greedy-v821-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AJK_REQUIRE_HIGHS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-v82.txt
      - run: python -m py_compile app.py fpl_engine.py fast_greedy_v821.py install_v821.py
      - run: python -m unittest -v test_fast_greedy_v821 test_milp_v82 test_engine
